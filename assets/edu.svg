<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Computer Engineering at Universidad Valle del Momboy, Venezuela. Currently taking Harvard CS50.">
<style>.t{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
.big{font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-weight:700}
.bar{transform-box:fill-box;transform-origin:left center;animation:fill 3.2s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes fill{from{transform:scaleX(.08)}to{transform:scaleX(.72)}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
</style>
<rect width="600" height="300" fill="#141518"/>
<text x="20" y="28" class="t" font-size="13" fill="#6b6f7a">/ EDUCATION</text>
<rect x="20" y="44" width="110" height="110" fill="#1A3FB0"/>
<text x="75" y="111" text-anchor="middle" class="big" font-size="34" fill="#FFFFFF">UVM</text>
<rect x="20" y="44" width="20" height="20" fill="#F5C518" stroke="#000" stroke-width="2"/>
<text x="148" y="70"  class="t" font-size="12" fill="#9aa0ab">UNIVERSIDAD VALLE DEL MOMBOY</text>
<text x="148" y="86"  class="t" font-size="12" fill="#6b6f7a">VENEZUELA</text>
<text x="148" y="122" class="big" font-size="28" fill="#FFFFFF">Computer Engineering</text>
<text x="148" y="146" class="t" font-size="13" fill="#9aa0ab">Ingeniería en Computación</text>
<line x1="20" y1="176" x2="580" y2="176" stroke="#2a2c33"/>
<rect x="20" y="196" width="80" height="80" fill="#E5352B"/>
<text x="60" y="244" text-anchor="middle" class="t" font-size="20" fill="#FFFFFF">CS</text>
<text x="118" y="218" class="t" font-size="12" fill="#9aa0ab">HARVARD UNIVERSITY · IN PROGRESS</text>
<text x="118" y="248" class="big" font-size="28" fill="#FFFFFF">CS50<tspan class="cur" fill="#F5C518">_</tspan></text>
<rect x="118" y="264" width="462" height="10" fill="#2a2c33"/>
<rect x="118" y="264" width="462" height="10" fill="#F5C518" class="bar"/>
</svg>