<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" role="img" aria-label="A blue arched door with the Morfe seal engraved through it; light shines through the letters and projects them onto the floor, then the door swings open onto morfe.studio — coming soon">
<style>.t{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
