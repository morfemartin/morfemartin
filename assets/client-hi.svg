<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="200" height="110" role="img" aria-label="HAWAII — SUNNER.CO">
<style>.t{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
.big{font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-weight:700}
.in{opacity:0;animation:in .6s ease-out 0.7s forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.arr{animation:nudge 1.8s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(3px)}}
</style>
<g class="in"><rect x="1.5" y="1.5" width="197" height="107" fill="#141518" stroke="#FFFFFF" stroke-width="3"/>
<text x="16" y="44" class="big" font-size="30" fill="#FFFFFF">HI</text>
<text x="16" y="72" class="t" font-size="10" fill="#FFFFFF" fill-opacity=".75">HAWAII</text>
<text x="16" y="92" class="big" font-size="13" fill="#FFFFFF">SUNNER.CO</text>
<text x="178" y="30" class="t arr" font-size="14" fill="#FFFFFF" text-anchor="end">↗</text></g>
</svg>