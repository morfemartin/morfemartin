<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" role="img" aria-label="Computer Engineering at Universidad Valle del Momboy, Venezuela. Currently taking Harvard CS50.">
  <style>
    .t   { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .big { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: fill 3.2s cubic-bezier(.65,0,.35,1) infinite alternate; }
    @keyframes fill { from { transform: scaleX(.08); } to { transform: scaleX(.72); } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="860" height="170" fill="#141518"/>
  <text x="24" y="30" class="t" font-size="11" fill="#6b6f7a">/ EDUCATION</text>

  <!-- UVM -->
  <rect x="24" y="46" width="100" height="100" fill="#1A3FB0"/>
  <text x="74" y="106" text-anchor="middle" class="big" font-size="30" fill="#FFFFFF">UVM</text>
  <rect x="24" y="46" width="18" height="18" fill="#F5C518" stroke="#000" stroke-width="2"/>
  <text x="140" y="72"  class="t" font-size="11" fill="#9aa0ab">UNIVERSIDAD VALLE DEL MOMBOY · VENEZUELA</text>
  <text x="140" y="104" class="big" font-size="24" fill="#FFFFFF">Computer Engineering</text>
  <text x="140" y="130" class="t" font-size="11" fill="#6b6f7a">Ingeniería en Computación</text>

  <!-- CS50 -->
  <line x1="560" y1="46" x2="560" y2="146" stroke="#2a2c33"/>
  <rect x="584" y="46" width="44" height="44" fill="#E5352B"/>
  <text x="606" y="74" text-anchor="middle" class="t" font-size="12" fill="#FFFFFF">CS</text>
  <text x="642" y="62"  class="t" font-size="11" fill="#9aa0ab">HARVARD · IN PROGRESS</text>
  <text x="642" y="86"  class="big" font-size="20" fill="#FFFFFF">CS50<tspan class="cur" fill="#F5C518">_</tspan></text>
  <rect x="584" y="118" width="252" height="8" fill="#2a2c33"/>
  <rect x="584" y="118" width="252" height="8" fill="#F5C518" class="bar"/>
</svg>
