<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150" role="img" aria-label="International clients: United States, United Kingdom, Singapore, Hawaii">
  <style>
    .t   { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .big { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
    .cell { opacity: 0; animation: in .6s ease-out forwards; }
    .c1 { animation-delay: .1s } .c2 { animation-delay: .3s } .c3 { animation-delay: .5s } .c4 { animation-delay: .7s }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.6); opacity: .4; } }
  </style>
  <rect width="860" height="150" fill="#141518"/>
  <text x="24" y="30" class="t" font-size="11" fill="#6b6f7a">/ INTERNATIONAL CLIENTS</text>
  <circle class="pulse" cx="836" cy="26" r="5" fill="#F5C518"/>

  <g class="cell c1">
    <rect x="24"  y="46" width="196" height="80" fill="#1A3FB0"/>
    <text x="40"  y="84"  class="big" font-size="30" fill="#FFFFFF">US</text>
    <text x="40"  y="110" class="t" font-size="11" fill="#FFFFFF" fill-opacity=".75">UNITED STATES · NY</text>
  </g>
  <g class="cell c2">
    <rect x="232" y="46" width="196" height="80" fill="#E5352B"/>
    <text x="248" y="84"  class="big" font-size="30" fill="#FFFFFF">UK</text>
    <text x="248" y="110" class="t" font-size="11" fill="#FFFFFF" fill-opacity=".8">UNITED KINGDOM</text>
  </g>
  <g class="cell c3">
    <rect x="440" y="46" width="196" height="80" fill="#F5C518" stroke="#000" stroke-width="2"/>
    <text x="456" y="84"  class="big" font-size="30" fill="#141518">SG</text>
    <text x="456" y="110" class="t" font-size="11" fill="#141518">SINGAPORE · EVENTS</text>
  </g>
  <g class="cell c4">
    <rect x="648" y="46" width="188" height="80" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="664" y="84"  class="big" font-size="30" fill="#FFFFFF">HI</text>
    <text x="664" y="110" class="t" font-size="11" fill="#9aa0ab">HAWAII · SUNNER.CO</text>
  </g>
</svg>
