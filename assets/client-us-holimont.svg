<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" width="280" height="110" role="img" aria-label="United States, New York — HoliMont">
<style>.t{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
.big{font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-weight:700}
.in{opacity:0;animation:in .6s ease-out .1s forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.arr{animation:nudge 1.8s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(3px)}}
</style>
<g class="in"><rect width="280" height="110" fill="#1A3FB0"/>
<text x="16" y="92" class="big" font-size="13" fill="#FFFFFF">HOLIMONT</text>
<text x="258" y="92" class="t arr" font-size="14" fill="#FFFFFF" text-anchor="end">↗</text></g>
</svg>